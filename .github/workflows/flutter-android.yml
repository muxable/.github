name: Release Android to Google Play Store

on:
  workflow_call:
    inputs:
      working-directory:
        default: "."
        type: string
      whats-new:
        default: "New features and minor bug fixes."
        type: string
      environment-name:
        type: string
      environment-url:
        type: string
      package-name:
        type: string
      publish:
        description: 'Publish to Google Play Store'
        required: false
        default: true
        type: boolean
    secrets:
      UPLOAD_KEYSTORE:
        required: true
      UPLOAD_KEYSTORE_PASSWORD:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  apkaab:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: paulhatch/semantic-version@v6.0.2
        id: semantic
        with:
          change_path: ${{ inputs.working-directory }}
          namespace: ${{ inputs.working-directory != '.' && inputs.working-directory || '' }}
          # keep the v5 defaults; v6 switched to conventional commits.
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"

      - run: echo $UPLOAD_KEYSTORE | base64 -d > ${{ inputs.working-directory }}/android/app/upload-keystore.jks
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ${{ inputs.working-directory }}/android/**/*.gradle*
            ${{ inputs.working-directory }}/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: flutter build appbundle
        working-directory: ${{ inputs.working-directory }}
        run: |
          flutter pub get
          flutter build appbundle --release --build-name=${{ steps.semantic.outputs.version }}

          # build an installable universal apk from the aab instead of rebuilding with gradle.
          curl -fsSL -o $RUNNER_TEMP/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar $RUNNER_TEMP/bundletool.jar build-apks --mode=universal \
            --bundle=build/app/outputs/bundle/release/app-release.aab --output=$RUNNER_TEMP/app.apks \
            "--ks=android/app/$STORE_FILE" "--ks-pass=pass:$STORE_PASSWORD" "--ks-key-alias=$KEY_ALIAS" "--key-pass=pass:$KEY_PASSWORD"
          unzip -o $RUNNER_TEMP/app.apks universal.apk -d $RUNNER_TEMP
          mkdir -p build/app/outputs/apk/release
          mv $RUNNER_TEMP/universal.apk build/app/outputs/apk/release/app-release.apk
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          STORE_FILE: upload-keystore.jks

      - uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: ${{ inputs.working-directory }}/build/app/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: ${{ inputs.working-directory }}/build/app/outputs/bundle/release/app-release.aab

      - if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: ${{ inputs.working-directory }}/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event_name == 'release' && 'production' || 'internal' }}
          status: ${{ github.event_name == 'release' && 'completed' || 'draft' }}
          mappingFile: ${{ inputs.working-directory }}/build/app/outputs/mapping/release/mapping.txt
