name: Release iOS to App Store

on:
  workflow_call:
    inputs:
      working-directory:
        default: "."
        type: string
      whats-new:
        default: "New features and minor bug fixes."
        type: string
      environment-name:
        type: string
      environment-url:
        type: string
      bundle-id:
        description: 'Bundle ID of the app. Detected from the Xcode project if not set.'
        required: false
        default: ""
        type: string
      publish:
        description: 'Publish to App Store'
        required: false
        default: true
        type: boolean
    secrets:
      APPSTORE_API_PRIVATE_KEY:
        required: true
      APPLE_CERTIFICATE_PRIVATE_KEY:
        required: true

jobs:
  ipa:
    # macos-latest only has Xcode 26; this image has the iOS 27 SDK.
    runs-on: xcode-27
    env:
      APP_STORE_CONNECT_ISSUER_ID: 863d4663-9217-4c36-9caa-e7b2201ec4f1
      APP_STORE_CONNECT_KEY_IDENTIFIER: PQPDACRFT7
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.APPLE_CERTIFICATE_PRIVATE_KEY }}
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: paulhatch/semantic-version@v6.0.2
        id: semantic
        with:
          change_path: ${{ inputs.working-directory }}
          namespace: ${{ inputs.working-directory != '.' && inputs.working-directory || '' }}
          # keep the v5 defaults; v6 switched to conventional commits.
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install codemagic-cli-tools
        run: |
          pip3 install codemagic-cli-tools
          # Xcode 27's altool logs a benign "ERROR: ... CDUploaderStateInfoResumeFilePath" line on
          # successful uploads. codemagic only ignores ERROR lines when "UPLOAD SUCCEEDED" is on the
          # first line of output (re.match), so it reports a failed publish. Search the whole output.
          # Non-zero exits, product errors and ERROR lines without "UPLOAD SUCCEEDED" still fail.
          python3 - <<'EOF'
          import importlib.util, pathlib
          p = pathlib.Path(importlib.util.find_spec("codemagic.models.altool.altool").origin)
          s = p.read_text()
          old = 're.match(".*UPLOAD SUCCEEDED.*", stdout)'
          if old in s:
              p.write_text(s.replace(old, 're.search("UPLOAD SUCCEEDED", stdout)'))
              print(f"Patched {p}")
          else:
              print(f"::warning::codemagic altool success check changed upstream, not patching {p}")
          EOF
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: flutter build ipa
        working-directory: ${{ inputs.working-directory }}
        run: |
          # apps using Swift Package Manager have no Podfile.
          if [ -f ios/Podfile ]; then
            pod repo update
          fi
          flutter pub get

          # configure codesigning
          # only look at the app's project: flutter pub get can place plugin example
          # projects under build/ios/SourcePackages.
          BUNDLE_ID="${{ inputs.bundle-id }}"
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID=$(xcode-project detect-bundle-id --project "ios/*.xcodeproj")
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" --platform IOS --type IOS_APP_STORE --create
          xcode-project use-profiles --project "ios/*.xcodeproj" --export-options-plist=$RUNNER_TEMP/export_options.plist --archive-method=app-store
          keychain initialize -p $RUNNER_TEMP/build.keychain
          keychain add-certificates -p $RUNNER_TEMP/build.keychain

          # fix expired apple wwdc certificate
          curl -o $RUNNER_TEMP/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $RUNNER_TEMP/build.keychain -T /usr/bin/codesign

          flutter build ipa --release --build-name=${{ steps.semantic.outputs.version }} --build-number=$(date +%Y%m%d%H%M) --export-options-plist=$RUNNER_TEMP/export_options.plist
          
          # upload debugging symbols
          # firebase_crashlytics comes from CocoaPods or Swift Package Manager.
          UPLOAD_SYMBOLS=$(find ios/Pods build/ios/SourcePackages ~/Library/Developer/Xcode/DerivedData \
            -path '*Crashlytics/upload-symbols' -type f 2>/dev/null | head -1)
          if [ -n "$UPLOAD_SYMBOLS" ]; then
            "$UPLOAD_SYMBOLS" -gsp ./ios/Runner/GoogleService-Info.plist -p ios ./build/ios/archive/Runner.xcarchive/dSYMs ||
              echo "::warning::Crashlytics dSYM upload failed"
          else
            echo "::warning::Crashlytics upload-symbols not found, skipping dSYM upload"
          fi

          # remove keychain
          keychain delete -p $RUNNER_TEMP/build.keychain
          security default-keychain -s login.keychain

      - uses: actions/upload-artifact@v7
        with:
          name: release.ipa
          path: ${{ inputs.working-directory }}/build/ios/ipa

      - uses: actions/upload-artifact@v7
        with:
          name: dSYMs
          path: ${{ inputs.working-directory }}/build/ios/archive/Runner.xcarchive/dSYMs

      - if: ${{ inputs.publish }}
        working-directory: ${{ inputs.working-directory }}
        run: app-store-connect publish ${{ github.event_name == 'release' && '--app-store' || '--testflight' }} --whats-new "${{ inputs.whats-new }}"
